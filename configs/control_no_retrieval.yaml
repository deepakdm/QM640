# CONTROL condition — LLM with no retrieval.
#
# Step 4.3 of the research-design guide requires control and experimental groups to be
# specified. This is the control: identical prompt, identical cases, identical model, but no
# retrieved context. The primary hypothesis (H1) is tested by comparing this against the
# retrieval configurations with an exact McNemar test on paired cases.
name: control_no_retrieval
corpus_dir: data/corpus
gold_path: data/gold/gold_cases.jsonl
chunking:
  strategy: fixed          # unused when retrieval.mode = none; kept so configs stay comparable
  chunk_size: 512
  overlap: 64
retrieval:
  mode: none
  top_k: 0
  rerank: false
  hybrid_alpha: 0.5
generation:
  temperature: 0.0
  max_tokens: 800
  require_citations: true
evaluation:
  runs_per_case: 3
  judge_sample_size: 40
