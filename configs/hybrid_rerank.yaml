# Config C — Hybrid (BM25 + dense) with cross-encoder re-ranking, section-aware chunks
name: hybrid_rerank_512
corpus_dir: data/corpus
gold_path: data/gold/gold_cases.jsonl
chunking:
  strategy: section        # respects regulation structure (e.g., 1005.11(c))
  chunk_size: 512
  overlap: 64
retrieval:
  mode: hybrid
  top_k: 5
  rerank: true
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  hybrid_alpha: 0.5
generation:
  temperature: 0.0
  max_tokens: 800
  require_citations: true
evaluation:
  runs_per_case: 3
  judge_sample_size: 40
